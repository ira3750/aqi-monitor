services:
  - type: web
    name: aqi-monitor-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aqi-monitor-db
          property: connectionString

databases:
  - name: aqi-monitor-db
    plan: free